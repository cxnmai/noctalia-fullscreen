name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - run: zig fmt --check build.zig src/*.zig
      - run: zig build test
      - run: zig build -Doptimize=ReleaseSmall
      - run: python3 tests/integration.py
